<!doctype html>
<html lang="pt-BR" data-type="software">
  <head>
    <meta charset="utf-8" />
    <title>Sobramar: o carnê dos seus próximos 12 meses</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="App de contas para quem recebe salário e parcela no cartão. Cada mês é uma folha com o que entra, o que sai e a sobra."
    />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="theme-color" content="#0b132b" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
      As fontes ficam aqui, e não em styles.scss: o CSS crítico que o build põe na página deixa
      `@font-face` de fora. As três da dobra são as do fontsource (copiadas para fonts/ pelo
      angular.json, só o latino). Cada reserva é uma fonte do sistema com a largura ajustada para
      ocupar o mesmo espaço da fonte final enquanto ela carrega, e a dobra não pula quando ela chega.
      Medidas com o texto do hero: Georgia é 32 % mais larga que a Instrument Serif; Segoe UI é
      5,2 % e Arial 2,9 % mais estreitas que a Onest. No Android vale o Roboto sem ajuste.
    -->
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/instrument-serif-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Onest Variable';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/onest-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Reserva da Serifa';
        src: local('Georgia'), local('Noto Serif');
        size-adjust: 75.5%;
      }
      @font-face {
        font-family: 'Reserva da Serifa';
        font-style: italic;
        src: local('Georgia Italic'), local('Georgia-Italic'), local('Noto Serif Italic');
        size-adjust: 75.9%;
      }
      @font-face {
        font-family: 'Reserva do Texto';
        src: local('Segoe UI'), local('SegoeUI');
        size-adjust: 105.2%;
      }
      @font-face {
        font-family: 'Reserva do Texto Arial';
        src: local('Arial'), local('ArialMT');
        size-adjust: 102.9%;
      }
    </style>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/onest-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/instrument-serif-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/instrument-serif-latin-400-italic.woff2"
      crossorigin
    />
    <!-- O primeiro quadro do filme da dobra (o mesmo de ativo-do-hero.ts): é o que se vê primeiro na tela larga. -->
    <link
      rel="preload"
      as="image"
      href="hero/carne-inicio.webp"
      fetchpriority="high"
      media="(min-width: 1240px) and (min-aspect-ratio: 3/2) and (prefers-reduced-motion: no-preference)"
    />
    <!-- Antes do CSS pintar: decide se a página pode se mexer (escolha guardada ou pedido do sistema). -->
    <script src="movimento.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
